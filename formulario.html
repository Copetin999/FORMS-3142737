<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <form>
        
        <h2>FORMULARIO SENA</h2>
      
        <label for "">¿Como te llamas?</label><br>
        <input type="text" placeholder="Nombre"><br>
        <label>¿Cual es tu correo?</label><br>
        <input type="text" placeholder="Correo"><br>
        <label>¿Cuantos años tienes?</label><br>
        <input type="text" placeholder="Edad"><br>

        <label>Choose an option</label><br>
        <select>
            <option value="0">Select an option</option>
            <option value="1">Option 1</option>
            <option value="2">Option 2</option>
            <option value="3">Option 3</option>
        </select><br>

        <label>Do you plan to buy a new car in the next 5 year? </label>
        <imput type="radio" name="buy" value="yes"> Yes <br>
        <imput type="radio" name="buy" value="no"> No <br>
        <imput type="radio" name="buy" value="maybe"> Maybe<br>
            <br>

        <label>what is yout favorite car brand?</label><br>
        <select>
            <option value="0">Select a brand</option>
            <option value="1">Toyota</option>
            <option value="2">Nissan</option>
            <option value="3">Mitsubishi</option>
            <option value="4">Honda</option>
            <option value="5">Hyundai</option>
        </select><br>
        <br>

        <label>what type of means of transportation do you own?</label><br>
        <br>
        <input type="checkbox" name="car" value="car"> Car <br>
        <input type="checkbox" name="motorcycle" value="motorcycle"> Motorcycle <br>
        <input type="checkbox" name="bus" value="bus"> Bus <br>
        <input type="checkbox" name="train" value="train"> Train <br>
        <input type="checkbox" name="plane" value="plane"> Plane <br>
        <input type="checkbox" name="boat" value="boat"> Boat <br>
        <br>

        <label>Any comments or suggestions?</label>
        <textarea name="comments" rows="5" cols="40"></textarea><br>
        <br>

        <input type="submit" value="Submit">

    </form>
</body>
</html>
